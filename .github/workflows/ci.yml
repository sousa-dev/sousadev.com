name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Validate the design handoff
        run: python3 scripts/audit_handoff.py

      - name: Tokens, content and copy rules
        run: |
          npm run check:tokens
          npm run check:content
          npm run check:copy

      - name: Types and content collections
        run: npm run check

      - name: Proposal endpoint tests
        run: npm run test:server

      - name: Build
        run: npm run build

      - name: Output checks
        run: npm run check:output

      - name: Install browser for functional and accessibility checks
        run: npx playwright install --with-deps chromium

      - name: Functional browser checks
        run: npm run test:browser

      - name: Accessibility scan
        run: npm run test:a11y

      - name: Lighthouse
        run: npm run test:lighthouse

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: reports/
          if-no-files-found: ignore
